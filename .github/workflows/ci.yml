name: CI Pipeline & Test Reporter

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        id: run_tests
        continue-on-error: true
        run: npx jest --json --outputFile=jest-results.json

      - name: Send Report to Local Receiver / Tunnel
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let testResults = {};
            try {
              testResults = JSON.parse(fs.readFileSync("jest-results.json", "utf8"));
            } catch(e) {
              testResults = { success: false, message: "Tests failed to execute properly" };
            }

            const payload = {
              repository: process.env.GITHUB_REPOSITORY,
              branch: process.env.GITHUB_REF_NAME,
              commitSHA: process.env.GITHUB_SHA,
              runId: process.env.GITHUB_RUN_ID,
              timestamp: new Date().toISOString(),
              status: testResults.success ? "PASSED" : "FAILED",
              totalTests: testResults.numTotalTests || 0,
              passedTests: testResults.numPassedTests || 0,
              failedTests: testResults.numFailedTests || 0,
              testResults: testResults.testResults || []
            };

            const targetUrl = "${{ secrets.LOCAL_RECEIVER_URL }}/receive-report";
            
            if ("${{ secrets.LOCAL_RECEIVER_URL }}") {
              fetch(targetUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              }).then(res => console.log("Report sent successfully"))
                .catch(err => console.error("Failed to send report", err));
            } else {
              console.log("LOCAL_RECEIVER_URL secret not set, skipping remote send.");
            }
          '

      - name: Fail Job if Tests Failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1